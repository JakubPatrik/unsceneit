<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Same look as the in-page dialog (notice.js NOTICE_CSS). -->
    <style>
      [hidden] { display: none !important; }
      html { color-scheme: dark; }
      body {
        width: 300px; margin: 0; padding: 16px;
        background: #0e0e14; color: #f2f2f7;
        font: 13px/1.45 system-ui, sans-serif;
      }
      header { margin-bottom: 14px; }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .logo { display: block; width: 150px; height: auto; }
      .tagline { margin: 6px 0 0; font-size: 11.5px; color: #b8b8c8; }
      .site { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 11.5px; color: #b8b8c8; }
      .site::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #5fe0a0; }
      .site b { color: #f2f2f7; font-weight: 600; }
      body.site-off .site::before { background: #8b8b98; }
      body.site-off .card { opacity: 0.45; }
      body.no-site .site::before { display: none; }

      .card { padding: 10px; border-radius: 10px; background: #1b1b26; }
      .card + .card { margin-top: 10px; }
      .label {
        font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
        color: #a99cff; margin-bottom: 6px;
      }
      .muted { color: #b8b8c8; }
      .error { color: #ffd479; font-size: 12px; }

      select {
        width: 100%; margin-bottom: 8px; padding: 6px 8px; border-radius: 8px; font: inherit;
        border: 1px solid #44445a; background: #262634; color: #f2f2f7;
      }
      select:focus-visible { outline: 2px solid #a99cff; outline-offset: 1px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { display: inline-flex; align-items: center; cursor: pointer; }
      .chip input, .switch input { position: absolute; opacity: 0; pointer-events: none; }
      .chip span {
        padding: 4px 9px; border-radius: 999px; border: 1px solid #44445a; background: #262634;
        font-size: 12px; user-select: none; transition: background-color 0.15s ease, border-color 0.15s ease;
      }
      .chip:hover span { background: #33334a; }
      .chip input:checked + span { background: #6b4cff; border-color: #6b4cff; color: #fff; }
      .chip input:focus-visible + span { outline: 2px solid #a99cff; outline-offset: 1px; }

      .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
      .switch .text { flex: 1; }
      .switch .track {
        position: relative; flex: none; width: 28px; height: 16px; border-radius: 999px; background: #44445a;
        transition: background-color 0.2s ease;
      }
      .switch .track::after {
        content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
        background: #fff; transition: transform 0.2s ease;
      }
      .switch input:checked + .track { background: #6b4cff; }
      .switch input:checked + .track::after { transform: translateX(12px); }
      .switch input:focus-visible + .track { outline: 2px solid #a99cff; outline-offset: 1px; }
      .switch input:disabled + .track { opacity: 0.4; cursor: not-allowed; }
      /* The site switch in the header: a bigger version. */
      .switch.big .track { width: 38px; height: 22px; }
      .switch.big .track::after { top: 3px; left: 3px; width: 16px; height: 16px; }
      .switch.big input:checked + .track::after { transform: translateX(16px); }
      .hint { margin: 6px 0 0; font-size: 11px; color: #b8b8c8; }
    </style>
  </head>
  <body>
    <header>
      <div class="top">
        <img class="logo" src="icons/logo-light.png" alt="unscene.it" />
        <!-- On/off for the current site (site.js); popup.js fills it in. -->
        <label class="switch big" title="Turn unscene.it on or off on this site">
          <input type="checkbox" id="site-switch" checked aria-describedby="site-label" />
          <span class="track"></span>
        </label>
      </div>
      <p class="tagline">The scenes you'll never see.</p>
      <p class="site" id="site-label"></p>
    </header>

    <form id="filters" class="card" autocomplete="off">
      <div class="label">Your filters</div>
      <div id="filters-body" class="muted">Loading filters…</div>
    </form>

    <form id="hidden-scenes" class="card">
      <div class="label">Hidden scenes</div>
      <label class="switch">
        <span class="text">Mute sound while hidden</span>
        <input type="checkbox" name="mute" checked />
        <span class="track"></span>
      </label>
      <p class="hint">Flagged scenes are blurred while they play. Sound comes back when the scene ends.</p>
    </form>

    <form id="thumbnails" class="card">
      <div class="label">Thumbnails</div>
      <label class="switch">
        <span class="text">Blur video thumbnails</span>
        <input type="checkbox" name="blur" checked />
        <span class="track"></span>
      </label>
      <p class="hint">Blurs every video thumbnail and hover preview before it can show.</p>
    </form>

    <script src="site.js"></script>
    <script src="logic.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
